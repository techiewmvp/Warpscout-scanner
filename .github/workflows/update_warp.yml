name: Auto Generate WARP Config

on:
  schedule:
    # 建议每 4 小时运行一次，因为 Opera 凭据通常 4 小时过期
    - cron: '0 */4 * * *'
  workflow_dispatch: # 支持手动点击随时运行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装 warpscout
        run: |
          curl -fsSL https://raw.githubusercontent.com/vernette/warpscout/master/install.sh | sh
          warpscout version

      - name: 下载 opera-proxy 落地采集工具
        run: |
          set -euo pipefail
          VER=$(curl -sL https://api.github.com/repos/snawoot-proxies-forks/opera-proxy/releases/latest | jq -r '.tag_name')
          curl -sL -o opera-proxy "https://github.com/snawoot-proxies-forks/opera-proxy/releases/download/${VER}/opera-proxy.linux-amd64"
          chmod +x opera-proxy

      - name: 注册 Cloudflare WARP 凭据
        run: |
          # 注册生成 best-mihomo.yaml 模板
          warpscout register
          warpscout scan -p masque-h2 -masque-sni www.apple.com -n 1 \
            -o scan-report.txt \
            -conf best-mihomo.yaml \
            -conf-type mihomo

      - name: 获取 Opera 免费代理凭据与多国落地
        run: |
          set -euo pipefail
          # 运行 opera-proxy 获取三个大区的真实落地和临时账号
          ./opera-proxy -country AS -list-proxies > opera_as.txt || true
          ./opera-proxy -country EU -list-proxies > opera_eu.txt || true
          ./opera-proxy -country AM -list-proxies > opera_am.txt || true

      - name: 执行终极套娃融合解析
        run: |
          python generate_sub.py

      - name: 提交并推送到当前仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add warp.yaml
          
          if git diff --staged --quiet; then
            echo "配置无变化，无需推送。"
          else
            git commit -m "Auto update warp.yaml with Opera over MASQUE [skip ci]"
            git push
          fi
